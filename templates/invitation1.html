<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananya &amp; Rohan — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!--
  ============================================================
  HOW TO REUSE FOR EVERY CLIENT
  ============================================================
  Scroll to <script id="config"> near the bottom. Edit ONLY that
  block — names, date, photos, poetry line, story, events,
  gallery, RSVP number, and the 3 color values. Nothing else
  needs to change. Duplicate this file per client.
  ============================================================
-->

<style>
  :root{
    --primary:#5C1530; --primary-deep:#3D0E20;
    --gold:#C9A227; --gold-light:#E9CE7E;
    --bg:#FBF6EC; --surface:#FFFFFF;
    --ink:#241016; --ink-soft:rgba(36,16,22,0.65);
    --line:rgba(36,16,22,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Work Sans',sans-serif; line-height:1.7;
    overflow-x:hidden;
  }
  body.locked{overflow:hidden; height:100vh;}
  h1,h2,.serif{font-family:'Cormorant Garamond',serif; font-weight:600;}
  .wrap{max-width:680px; margin:0 auto; padding:0 24px; position:relative; z-index:2;}
  img{max-width:100%; display:block;}

  /* ===================== SCROLL PROGRESS ===================== */
  .progress{position:fixed; top:0; left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--gold),var(--primary)); z-index:500;}

  /* ===================== PETALS (ambient, continuous) ===================== */
  #petals{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .petal{
    position:absolute; top:-5%; width:14px; height:14px; opacity:.85;
    background:radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold));
    border-radius:0 60% 0 60%;
    animation: fall linear infinite, sway ease-in-out infinite;
  }
  @keyframes fall{ to{ transform:translateY(110vh); } }
  @keyframes sway{ 0%,100%{ margin-left:0; } 50%{ margin-left:40px; } }

  /* ===================== INTRO / ENVELOPE GATE ===================== */
  #gate{
    position:fixed; inset:0; z-index:1000;
    background:radial-gradient(circle at 50% 40%, #6b1c3a 0%, var(--primary-deep) 70%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transition:opacity .9s ease, visibility .9s ease;
  }
  #gate.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .seal{
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #9c7a1b 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:2.6rem; color:var(--primary-deep);
    cursor:pointer; box-shadow:0 0 0 6px rgba(201,162,39,0.18), 0 20px 50px rgba(0,0,0,0.4);
    animation: pulse 2.4s ease-in-out infinite;
    transition: transform .5s cubic-bezier(.2,.9,.2,1.3);
    user-select:none;
  }
  .seal:active{transform:scale(.94);}
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 6px rgba(201,162,39,0.18), 0 20px 50px rgba(0,0,0,0.4);} 50%{ box-shadow:0 0 0 14px rgba(201,162,39,0.06), 0 20px 50px rgba(0,0,0,0.4);} }
  .gate-text{
    color:var(--gold-light); font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:1.3rem; margin-top:28px; text-align:center; opacity:0; animation:fadeUp 1s ease forwards .4s;
  }
  .gate-hint{
    color:rgba(233,206,126,0.55); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.2em;
    margin-top:14px; opacity:0; animation:fadeUp 1s ease forwards .8s;
  }
  @keyframes fadeUp{ to{opacity:1;} }
  #gate.opening .seal{ transform:scale(0) rotate(180deg); }
  #gate.opening .gate-text, #gate.opening .gate-hint{ opacity:0; transition:opacity .3s; }

  /* ===================== HERO ===================== */
  .hero{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:60px 24px; position:relative; z-index:2;
    background:linear-gradient(180deg, var(--bg) 0%, #F2E9D8 100%);
  }
  .hero::before, .hero::after{ content:""; position:absolute; left:50%; transform:translateX(-50%); width:1px; height:50px; background:var(--gold); }
  .hero::before{top:24px;} .hero::after{bottom:24px;}
  .motif{ font-size:1.6rem; color:var(--gold); margin-bottom:16px; opacity:0; animation:riseIn .8s ease forwards .1s; }
  .eyebrow{ font-size:0.76rem; text-transform:uppercase; letter-spacing:0.22em; color:var(--gold); font-weight:600; margin-bottom:20px; opacity:0; animation:riseIn .8s ease forwards .25s; }
  .hero-photo-wrap{ position:relative; margin-bottom:26px; opacity:0; animation:riseIn .9s ease forwards .35s; }
  .hero-photo-wrap::before{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    border:1px dashed var(--gold); animation:spin 30s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .hero-photo{ width:190px; height:190px; border-radius:50%; object-fit:cover; border:4px solid var(--surface); box-shadow:0 14px 44px rgba(61,14,32,0.3); }
  .hero h1{
    font-size:clamp(2.4rem,7vw,3.8rem); line-height:1.12; margin-bottom:10px;
    background:linear-gradient(100deg, var(--primary-deep) 30%, var(--gold) 50%, var(--primary-deep) 70%);
    background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-220% center; } }
  .hero h1 .amp{ font-style:italic; color:var(--gold); padding:0 10px; -webkit-text-fill-color:var(--gold); }
  .hero .sub{ font-size:1.05rem; color:var(--ink-soft); margin-bottom:36px; opacity:0; animation:riseIn .8s ease forwards .5s; }
  @keyframes riseIn{ to{opacity:1; transform:translateY(0);} from{transform:translateY(16px);} }

  /* flip countdown */
  .countdown{ display:flex; gap:14px; opacity:0; animation:riseIn .8s ease forwards .65s; }
  .flip{ perspective:300px; }
  .flip-card{
    width:62px; height:74px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; position:relative; box-shadow:0 8px 20px rgba(61,14,32,0.12);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:600; color:var(--primary-deep);
  }
  .flip-card::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line); }
  .flip-card.bump{ animation:bump .4s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.12) translateY(-3px);} 100%{transform:scale(1);} }
  .flip-label{ display:block; text-align:center; font-family:'Work Sans',sans-serif; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); margin-top:8px; font-weight:500; }

  .scroll-cue{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    width:24px; height:38px; border:2px solid var(--gold); border-radius:14px;
    opacity:0; animation:riseIn .8s ease forwards 1s;
  }
  .scroll-cue::before{
    content:""; position:absolute; top:7px; left:50%; width:4px; height:8px; border-radius:2px;
    background:var(--gold); transform:translateX(-50%); animation:cue 1.6s ease-in-out infinite;
  }
  @keyframes cue{ 0%{opacity:1; top:7px;} 70%{opacity:0; top:20px;} 100%{opacity:0; top:7px;} }

  /* ===================== SECTIONS ===================== */
  section{ padding:90px 0; position:relative; z-index:2; }
  .section-label{ font-size:0.74rem; text-transform:uppercase; letter-spacing:0.2em; color:var(--gold); font-weight:600; text-align:center; margin-bottom:14px; }
  .section-title{ text-align:center; font-size:clamp(1.8rem,4vw,2.4rem); color:var(--primary-deep); margin-bottom:50px; }

  /* poetry */
  .poetry{ text-align:center; padding:50px 0; }
  .poetry .mark{ font-size:2.6rem; color:var(--gold-light); line-height:1; }
  .poetry p{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(1.3rem,3vw,1.8rem); color:var(--primary-deep); max-width:540px; margin:14px auto 0; }
  .poetry .by{ margin-top:18px; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); }

  /* timeline with drawing line */
  .timeline{ position:relative; max-width:560px; margin:0 auto; padding-left:28px; }
  .timeline::before{
    content:""; position:absolute; left:5px; top:0; bottom:0; width:2px; background:var(--line);
  }
  .timeline-progress{
    position:absolute; left:5px; top:0; width:2px; height:0%; background:linear-gradient(180deg,var(--gold),var(--primary)); transition:height .15s linear;
  }
  .t-item{ position:relative; padding:0 0 44px 22px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-dot{
    position:absolute; left:-28px; top:2px; width:13px; height:13px; border-radius:50%;
    background:var(--surface); border:2px solid var(--line); transition:all .4s ease;
  }
  .t-item.in .t-dot{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,162,39,0.2); }
  .t-date{ font-family:'Cormorant Garamond',serif; color:var(--gold); font-size:1rem; font-weight:600; margin-bottom:4px; }
  .t-item h3{ font-size:1.15rem; color:var(--primary-deep); margin-bottom:4px; }
  .t-item p{ font-size:0.92rem; color:var(--ink-soft); }

  /* event cards */
  .events{ display:grid; gap:18px; }
  .event-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:26px; display:flex; gap:18px; align-items:flex-start;
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .event-card:hover{ transform:translateY(-5px); box-shadow:0 16px 36px rgba(61,14,32,0.14); }
  .event-icon{
    width:46px; height:46px; border-radius:50%; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--gold); font-size:1.3rem; font-family:'Cormorant Garamond',serif;
  }
  .event-card h3{ color:var(--primary-deep); font-size:1.22rem; margin-bottom:6px; }
  .event-card .meta{ font-size:0.88rem; color:var(--ink-soft); }

  /* gallery + lightbox */
  .gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .gallery .g-item{ overflow:hidden; border-radius:8px; cursor:pointer; position:relative; }
  .gallery img{ width:100%; height:160px; object-fit:cover; transition:transform .5s ease; }
  .gallery .g-item:hover img{ transform:scale(1.1); }
  .g-item::after{
    content:"⤢"; position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(36,16,22,0.45); color:#fff; font-size:0.8rem; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .3s;
  }
  .g-item:hover::after{ opacity:1; }

  #lightbox{
    position:fixed; inset:0; background:rgba(18,11,16,0.94); z-index:900;
    display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility .3s ease;
  }
  #lightbox.active{ opacity:1; visibility:visible; }
  #lightbox img{ max-width:88vw; max-height:78vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .lb-close, .lb-prev, .lb-next{
    position:absolute; color:var(--gold-light); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; cursor:pointer; transition:background .2s;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{ background:rgba(255,255,255,0.18); }
  .lb-close{ top:20px; right:20px; }
  .lb-prev{ left:20px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:20px; top:50%; transform:translateY(-50%); }

  /* RSVP */
  .rsvp{
    background:linear-gradient(155deg, var(--primary) 0%, var(--primary-deep) 100%);
    color:var(--bg); border-radius:18px; padding:54px 30px; text-align:center; position:relative; overflow:hidden;
  }
  .rsvp::before{
    content:""; position:absolute; width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,39,0.18), transparent 70%);
    top:-100px; right:-100px;
  }
  .rsvp .section-label{ color:var(--gold-light); }
  .rsvp h2{ color:var(--bg); margin-bottom:14px; position:relative; }
  .rsvp p{ color:rgba(251,246,236,0.78); max-width:420px; margin:0 auto 30px; position:relative; }
  .rsvp-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--gold); color:var(--primary-deep);
    padding:17px 36px; border-radius:50px; font-weight:600; font-size:0.95rem;
    position:relative; transition:transform .15s ease;
  }
  .rsvp-btn:active{ transform:scale(.96); }
  .rsvp-meta{ margin-top:22px; font-size:0.8rem; color:rgba(251,246,236,0.6); position:relative; }

  footer{ text-align:center; padding:50px 24px; font-size:0.82rem; color:var(--ink-soft); position:relative; z-index:2; }
  footer .signoff{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.2rem; color:var(--primary-deep); margin-bottom:10px; display:block; }

  /* ambient music toggle */
  #musicBtn{
    position:fixed; bottom:22px; right:22px; z-index:200; width:50px; height:50px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line); box-shadow:0 8px 24px rgba(61,14,32,0.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.2rem;
  }
  #musicBtn .bars{ display:flex; gap:2px; align-items:flex-end; height:14px; }
  #musicBtn .bars span{ width:3px; background:var(--gold); border-radius:1px; animation:eq 1s ease-in-out infinite; }
  #musicBtn.muted .bars span{ animation-play-state:paused; height:3px !important; }
  #musicBtn .bars span:nth-child(1){ animation-delay:0s; }
  #musicBtn .bars span:nth-child(2){ animation-delay:.2s; }
  #musicBtn .bars span:nth-child(3){ animation-delay:.4s; }
  @keyframes eq{ 0%,100%{height:4px;} 50%{height:14px;} }

  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  @media(max-width:560px){
    .countdown{ gap:8px; }
    .flip-card{ width:50px; height:62px; font-size:1.4rem; }
    .gallery{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>

<div class="progress" id="progress"></div>

<div id="gate">

<section class="hero">

<section class="poetry reveal">

  <div class="by" id="poetryBy"></div>
</section>

<section class="reveal">
  <div class="wrap">

     EDIT EVERYTHING BELOW THIS LINE FOR EACH NEW CLIENT

<script id="config">
const CONFIG = {
  partner1: "Ananya",
  partner2: "Rohan",
  motif: "✦",
  eyebrow: "Together With Their Families",
  heroSub: "Request the honour of your presence as they begin forever",
  heroPhoto: "https://images.unsplash.com/photo-1519741497674-611481863552?w=600&q=80",

  eventDateISO: "2027-02-12T17:00:00",

  poetryLine: "Two souls, one heart — two paths that became a single journey home.",
  poetryBy: "— Ananya & Rohan",

  storyLabel: "Our Story",
  storyTitle: "How It All Began",
  timeline: [
    { date: "2019", title: "We met", text: "A chance introduction through mutual friends in Chennai." },
    { date: "2022", title: "We fell in love", text: "Three years of late-night calls, road trips, and certainty." },
    { date: "2026", title: "He asked", text: "On a quiet beach in Pondicherry, under string lights." },
    { date: "2027", title: "We say yes, forever", text: "And now, we invite you to celebrate with us." }
  ],

  eventsTitle: "Celebration Details",
  events: [
    { icon: "✤", name: "Mehendi", date: "10th Feb 2027 · 4:00 PM", venue: "Rosewood Lawns, ECR" },
    { icon: "♪", name: "Sangeet & Cocktails", date: "11th Feb 2027 · 7:00 PM", venue: "The Leela Palace, Ballroom" },
    { icon: "✦", name: "Wedding Ceremony", date: "12th Feb 2027 · 5:00 PM", venue: "The Leela Palace, Lawns" },
    { icon: "✺", name: "Reception", date: "12th Feb 2027 · 8:30 PM", venue: "The Leela Palace, Grand Hall" }
  ],

  gallery: [
    "https://images.unsplash.com/photo-1606800052052-a08af7148866?w=700&q=80",
    "https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=700&q=80",
    "https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=700&q=80",
    "https://images.unsplash.com/photo-1583939411023-2f7a5e6f4318?w=700&q=80",
    "https://images.unsplash.com/photo-1532712938310-34cb3982ef74?w=700&q=80",
    "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=700&q=80"
  ],

  rsvpTitle: "We Can't Wait To Celebrate With You",
  rsvpText: "Kindly confirm your attendance by 1st February 2027 so we can plan everything perfectly.",
  rsvpWhatsapp: "919999999999",
  rsvpWhatsappMsg: "Hi! I'd love to confirm my attendance for Ananya & Rohan's wedding.",
  rsvpMeta: "Kanchipuram, Tamil Nadu · Dress code: Pastels & Florals",

  footerSignoff: "With love, Ananya & Rohan",
  footerNote: "Crafted by Subh Invites",

  // optional: a royalty-free ambient track URL. Leave empty to hide the music button.
  ambientAudio: "",

  colors: { primary: "#5C1530", primaryDeep: "#3D0E20", gold: "#C9A227" }
};
</script>

<script>
  // ============================================================
  // RENDER ENGINE — no need to touch this for normal orders
  // ============================================================
  const c = CONFIG;
  document.documentElement.style.setProperty('--primary', c.colors.primary);
  document.documentElement.style.setProperty('--primary-deep', c.colors.primaryDeep);
  document.documentElement.style.setProperty('--gold', c.colors.gold);

  document.getElementById('motif').textContent = c.motif;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('heroPhoto').src = c.heroPhoto;
  document.getElementById('heroPhoto').alt = `${c.partner1} and ${c.partner2}`;
  document.getElementById('heroNames').innerHTML = `${c.partner1}<span class="amp">&amp;</span>${c.partner2}`;
  document.getElementById('heroSub').textContent = c.heroSub;
  document.getElementById('gateNames').textContent = `${c.partner1} & ${c.partner2}`;

  document.getElementById('poetryLine').textContent = c.poetryLine;
  document.getElementById('poetryBy').textContent = c.poetryBy;

  document.getElementById('storyLabel').textContent = c.storyLabel;
  document.getElementById('storyTitle').textContent = c.storyTitle;
  const timelineEl = document.getElementById('timeline');
  c.timeline.forEach(t => {
    const div = document.createElement('div');
    div.className = 't-item reveal';
    div.innerHTML = `<div class="t-dot"></div><div class="t-date">${t.date}</div><h3>${t.title}</h3><p>${t.text}</p>`;
    timelineEl.appendChild(div);
  });

  document.getElementById('eventsTitle').textContent = c.eventsTitle;
  document.getElementById('events').innerHTML = c.events.map(e => `
    <div class="event-card">
      <div class="event-icon">${e.icon}</div>
      <div><h3>${e.name}</h3><div class="meta">${e.date}</div><div class="meta">${e.venue}</div></div>
    </div>`).join('');

  document.getElementById('gallery').innerHTML = c.gallery.map((src,i) => `
    <div class="g-item" data-idx="${i}"><img src="${src}" loading="lazy" alt=""></div>`).join('');

  document.getElementById('rsvpTitle').textContent = c.rsvpTitle;
  document.getElementById('rsvpText').textContent = c.rsvpText;
  document.getElementById('rsvpMeta').textContent = c.rsvpMeta;
  document.getElementById('rsvpBtn').href = `https://wa.me/${c.rsvpWhatsapp}?text=${encodeURIComponent(c.rsvpWhatsappMsg)}`;

  document.getElementById('footerSignoff').textContent = c.footerSignoff;
  document.getElementById('footerNote').textContent = c.footerNote;

  /* ---------- opening gate ---------- */
  const gate = document.getElementById('gate');
  const seal = document.getElementById('sealBtn');
  seal.addEventListener('click', () => {
    gate.classList.add('opening');
    setTimeout(() => { gate.classList.add('hidden'); document.body.classList.remove('locked'); spawnPetals(); }, 500);
  });

  /* ---------- petals ---------- */
  function spawnPetals(){
    const layer = document.getElementById('petals');
    for(let i=0;i<18;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = Math.random()*100 + 'vw';
      p.style.width = p.style.height = (8+Math.random()*10)+'px';
      const dur = 9+Math.random()*9;
      p.style.animationDuration = dur+'s, '+(2+Math.random()*2)+'s';
      p.style.animationDelay = (Math.random()*dur)+'s, 0s';
      p.style.opacity = 0.4 + Math.random()*0.5;
      layer.appendChild(p);
    }
  }

  /* ---------- scroll progress ---------- */
  const progress = document.getElementById('progress');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    progress.style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight))*100 + '%';
  });

  /* ---------- flip countdown ---------- */
  const countdownEl = document.getElementById('countdown');
  const units = [['d','Days'],['h','Hrs'],['m','Min'],['s','Sec']];
  units.forEach(u => {
    const flip = document.createElement('div'); flip.className='flip';
    flip.innerHTML = `<div class="flip-card" id="cd-${u[0]}">00</div><span class="flip-label">${u[1]}</span>`;
    countdownEl.appendChild(flip);
  });
  const target = new Date(c.eventDateISO);
  let lastVals = {};
  function tickCountdown(){
    const diff = Math.max(0, target - new Date());
    const vals = {
      d: Math.floor(diff/86400000),
      h: Math.floor((diff%86400000)/3600000),
      m: Math.floor((diff%3600000)/60000),
      s: Math.floor((diff%60000)/1000)
    };
    Object.keys(vals).forEach(k => {
      const el = document.getElementById('cd-'+k);
      const padded = String(vals[k]).padStart(2,'0');
      if(lastVals[k] !== padded){
        el.textContent = padded;
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
        lastVals[k] = padded;
      }
    });
  }
  tickCountdown(); setInterval(tickCountdown, 1000);

  /* ---------- scroll reveal + timeline draw ---------- */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  const tProgress = document.getElementById('timelineProgress');
  const tItems = document.querySelectorAll('.t-item');
  function updateTimelineDraw(){
    const tl = document.getElementById('timeline');
    const rect = tl.getBoundingClientRect();
    const vh = window.innerHeight;
    const start = vh*0.85, end = vh*0.25;
    let pct = (start - rect.top) / (rect.height + start - end);
    pct = Math.max(0, Math.min(1, pct));
    tProgress.style.height = (pct*100) + '%';
  }
  window.addEventListener('scroll', updateTimelineDraw);
  updateTimelineDraw();

  /* ---------- lightbox gallery ---------- */
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  let lbIndex = 0;
  function openLightbox(i){ lbIndex = i; lbImg.src = c.gallery[i]; lightbox.classList.add('active'); }
  function closeLightbox(){ lightbox.classList.remove('active'); }
  function navLightbox(dir){ lbIndex = (lbIndex+dir+c.gallery.length)%c.gallery.length; lbImg.src = c.gallery[lbIndex]; }
  document.querySelectorAll('.g-item').forEach(item => item.addEventListener('click', () => openLightbox(+item.dataset.idx)));
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => navLightbox(-1));
  document.getElementById('lbNext').addEventListener('click', () => navLightbox(1));
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') navLightbox(-1);
    if(e.key === 'ArrowRight') navLightbox(1);
  });

  /* ---------- magnetic RSVP button ---------- */
  const rsvpBtn = document.getElementById('rsvpBtn');
  rsvpBtn.addEventListener('mousemove', (e) => {
    const r = rsvpBtn.getBoundingClientRect();
    rsvpBtn.style.transform = `translate(${(e.clientX-r.left-r.width/2)*0.18}px, ${(e.clientY-r.top-r.height/2)*0.3}px)`;
  });
  rsvpBtn.addEventListener('mouseleave', () => rsvpBtn.style.transform = '');

  /* ---------- ambient music ---------- */
  const musicBtn = document.getElementById('musicBtn');
  const audio = document.getElementById('bgAudio');
  if(c.ambientAudio){
    audio.src = c.ambientAudio;
    musicBtn.style.display = 'flex';
    let playing = false;
    musicBtn.addEventListener('click', () => {
      playing = !playing;
      musicBtn.classList.toggle('muted', !playing);
      if(playing) audio.play().catch(()=>{}); else audio.pause();
    });
  } else {
    musicBtn.style.display = 'none';
  }
</script>
</body>
</html>
